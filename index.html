<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EKEN Camera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
}

header{
    background:#222;
    padding:15px;
    font-size:28px;
    font-weight:bold;
}

#container{
    padding:20px;
}

img{
    width:100%;
    max-width:650px;
    border-radius:10px;
    border:2px solid #444;
}

#time{
    margin-top:15px;
    color:#bbb;
    font-size:18px;
}

</style>

</head>

<body>

<header>
📷 EKEN CAMERA LIVE
</header>

<div id="container">

<img id="camera"
     src="http://192.168.1.118:8080/live.jpg">

<div id="time">
Connecting...
</div>

</div>

<script>

const img = document.getElementById("camera");
const time = document.getElementById("time");

function refresh() {

    img.onload = function () {
        setTimeout(refresh, 66);
    };

    img.onerror = function () {
        setTimeout(refresh, 500);
    };

    img.src = "http://192.168.1.118:8080/live.jpg?t=" + Date.now();

    time.innerHTML = new Date().toLocaleTimeString();
}

refresh();

setInterval(refresh,66);

</script>

</body>

</html>
